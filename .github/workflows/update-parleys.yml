name: Actualizar Parleys Diarios

on:
  schedule:
    # 06:00 AM y 02:00 PM hora de Honduras (12:00 y 20:00 UTC)
    - cron: '0 12,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-parleys:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar script de pronósticos y partidos
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/fetch_parleys.py

      - name: Guardar y subir data/parleys.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parleys.json
          if git diff --staged --quiet; then
            echo "Sin cambios nuevos en parleys.json"
          else
            git commit -m "chore(parleys): actualizar pronósticos y partidos [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi