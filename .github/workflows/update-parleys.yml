name: Actualizar Parleys Cada 24 Horas

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 UTC (00:00 hora de Honduras)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Calcular probabilidades y parleys
        run: python scripts/fetch_parleys.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/parleys.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática de parleys (24h)" && git push)