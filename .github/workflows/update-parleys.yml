name: Actualizar Parleys Diarios

on:
  schedule:
    # 06:00 AM y 02:00 PM hora de Honduras (12:00 y 20:00 UTC)
    - cron: '0 12,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-parleys:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Respaldar parleys.json previo y ejecutar scraper
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -f data/parleys.json ]; then
            cp data/parleys.json /tmp/parleys_prev.json
          fi
          python scripts/fetch_parleys.py

      - name: Validar esquema JSON antes de commit
        run: |
          python -c "
          import json
          with open('data/parleys.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          required = {'updated_at', 'total_matches', 'matches', 'auto_parleys', 'stale'}
          assert required.issubset(data.keys()), f'Faltan llaves: {required - set(data.keys())}'
          assert isinstance(data['matches'], list), 'matches debe ser una lista'
          assert isinstance(data['auto_parleys'], list), 'auto_parleys debe ser una lista'
          print('Esquema JSON validado correctamente. Partidos:', len(data['matches']), 'Stale:', data['stale'])
          "

      - name: Keep-alive Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            curl -fsS -o /dev/null -w "Supabase HTTP: %{http_code}\n" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "${SUPABASE_URL%/}/rest/v1/profiles?select=id&limit=1" || echo "Aviso: Keep-alive de Supabase no respondió"
          else
            echo "Secrets SUPABASE_URL / SUPABASE_ANON_KEY no configurados; omitiendo keep-alive."
          fi

      - name: Enviar notificaciones Push (Recordatorios y Parleys)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CLAIMS_EMAIL: ${{ secrets.VAPID_CLAIMS_EMAIL }}
        run: |
          pip install --quiet pywebpush requests
          python scripts/send_push_notifications.py

      - name: Guardar y subir datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parleys.json data/parleys_history.json
          if git diff --staged --quiet; then
            echo "Sin cambios nuevos en parleys.json"
          else
            git commit -m "chore(parleys): actualizar pronósticos, historial y métricas [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi